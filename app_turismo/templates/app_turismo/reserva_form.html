{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-1">{{ titulo }}</h3>
                    <p class="text-muted small mb-3">
                        Completa los datos para guardar la reserva.
                    </p>
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form_campos.html' with form=form %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">💾 {{ accion }} Reserva</button>
                            <a href="{% url 'turismo_reserva_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
