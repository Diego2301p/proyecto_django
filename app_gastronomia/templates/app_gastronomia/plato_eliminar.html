{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow-sm">
                <div class="card-body p-4 text-center">
                    <h3 class="text-danger">🗑️ Eliminar plato</h3>
                    <p>¿Seguro que deseas eliminar el plato <strong>{{ plato.nombre }}</strong>?</p>
                    <p class="small text-muted">Las reservas que lo incluían quedarán sin experiencia gastronómica.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                        <a href="{% url 'gastronomia_plato_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
