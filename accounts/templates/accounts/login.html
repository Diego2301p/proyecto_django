{% extends 'base.html' %}
{% block titulo %}Iniciar Sesión - Chile Descubre{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-1">🔐 Iniciar Sesión</h2>
                    <p class="text-center text-muted mb-4">Ingresa con tu usuario y contraseña</p>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        {% include 'includes/form_campos.html' with form=form %}
                        <input type="hidden" name="next" value="{{ request.GET.next }}">
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
